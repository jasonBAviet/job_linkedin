<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      min-height: 420px;
      background-color: #0F172A;
      color: #F8FAFC;
      font-size: 13px;
      line-height: 1.4;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .brand-subtitle {
      font-size: 11px;
      color: #94A3B8;
      font-weight: 500;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background-color: #064E3B;
      color: #34D399;
      border: 1px solid #059669;
    }
    .status-badge.offline {
      background-color: #7F1D1D;
      color: #F87171;
      border-color: #DC2626;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #34D399;
    }
    .status-dot.offline {
      background-color: #F87171;
    }
    .card {
      background-color: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94A3B8;
      margin-bottom: 8px;
    }
    .job-preview {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .job-logo {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      background-color: #FFFFFF;
      border: 1px solid #475569;
      object-fit: contain;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #1E293B;
      font-size: 14px;
      padding: 2px;
    }
    .job-info {
      flex: 1;
      min-width: 0;
    }
    .job-name {
      font-weight: 700;
      color: #F8FAFC;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .job-company {
      font-size: 12px;
      color: #CBD5E1;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .job-meta {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 4px;
    }
    .empty-state {
      text-align: center;
      padding: 12px 6px;
      color: #94A3B8;
      font-size: 12px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background-color: #4F46E5;
      color: #FFFFFF;
      border: 1px solid #6366F1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .btn-primary:hover {
      background-color: #4338CA;
    }
    .btn-secondary {
      background-color: #334155;
      color: #F8FAFC;
      border: 1px solid #475569;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }
    .btn-link {
      background: none;
      color: #818CF8;
      text-decoration: underline;
      font-size: 11px;
      padding: 4px;
    }
    .server-config-input {
      width: 100%;
      background-color: #0F172A;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #F8FAFC;
      padding: 6px 8px;
      font-size: 11px;
      font-family: monospace;
      margin-bottom: 6px;
    }
    .server-config-input:focus {
      outline: none;
      border-color: #6366F1;
    }
    .alert {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      display: none;
      line-height: 1.4;
    }
    .alert-success {
      background-color: #064E3B;
      color: #6EE7B7;
      border: 1px solid #059669;
    }
    .alert-error {
      background-color: #7F1D1D;
      color: #FCA5A5;
      border: 1px solid #DC2626;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="brand-title">Job Hunter Extractor</div>
      <div class="brand-subtitle">Dynamic Ingestion & Mapping</div>
    </div>
    <div id="statusBadge" class="status-badge">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Dashboard Sẵn sàng</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Tin tuyển dụng phát hiện</div>
    <div id="jobContainer">
      <div class="empty-state" id="emptyState">
        Đang quét dữ liệu từ trang LinkedIn hiện tại...
      </div>
      <div class="job-preview" id="jobPreview" style="display: none;">
        <img id="jobLogoImg" class="job-logo" src="" alt="Logo" style="display: none;" />
        <div id="jobLogoFallback" class="job-logo">JH</div>
        <div class="job-info">
          <div class="job-name" id="jobTitle">Tiêu đề công việc</div>
          <div class="job-company" id="jobCompany">Tên công ty</div>
          <div class="job-meta" id="jobMeta">Địa điểm | Lương</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Cấu hình Máy chủ (Dynamic Server URL)</div>
    <input type="text" id="inputServerUrl" class="server-config-input" value="http://localhost:3000" placeholder="http://localhost:3000" />
    <button id="btnSaveServerUrl" class="btn btn-secondary" style="padding: 5px 10px; font-size: 11px;">
      Lưu cấu hình máy chủ
    </button>
  </div>

  <div class="actions">
    <button id="btnSyncCurrent" class="btn btn-primary">
      Đồng bộ công việc này vào Dashboard
    </button>
    <button id="btnScanAll" class="btn btn-secondary">
      Quét tất cả việc làm trên trang
    </button>
    <button id="btnOpenDashboard" class="btn btn-link">
      Mở Dashboard ứng dụng
    </button>
  </div>

  <div id="alertBox" class="alert"></div>

  <script src="popup.js"></script>
</body>
</html>
